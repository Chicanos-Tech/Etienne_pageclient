<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salle d'attente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60vh;
      background: radial-gradient(ellipse at top, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
      z-index: 0;
    }

    header {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: 2rem 4rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      position: relative;
      z-index: 10;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .logo-text {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .datetime {
      font-size: 1rem;
      color: #64748b;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem;
      position: relative;
      z-index: 5;
    }

    .label {
      font-size: 1.2rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .patient-card {
      background: #ffffff;
      border-radius: 32px;
      padding: 5rem 10rem;
      box-shadow: 
        0 0 0 1px rgba(0, 0, 0, 0.03),
        0 1px 2px rgba(0, 0, 0, 0.04),
        0 4px 8px rgba(0, 0, 0, 0.04),
        0 16px 32px rgba(0, 0, 0, 0.06);
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .patient-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%);
    }

    .patient-number {
      font-size: 16rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      letter-spacing: -0.04em;
      position: relative;
    }

    .message-badge {
      margin-top: 3.5rem;
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem 3.5rem;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      font-size: 1.8rem;
      font-weight: 600;
      border-radius: 100px;
      box-shadow: 
        0 0 0 1px rgba(59, 130, 246, 0.1),
        0 8px 24px rgba(59, 130, 246, 0.25),
        0 16px 48px rgba(59, 130, 246, 0.15);
      letter-spacing: -0.01em;
      transition: all 0.3s ease;
    }

    .message-icon {
      width: 2rem;
      height: 2rem;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 4rem;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      z-index: 10;
    }

    .footer-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .signature {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 500;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: dotPulse 2s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% {
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
      }
      50% {
        opacity: 0.8;
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
      }
    }

    .patient-card.new-patient {
      animation: cardPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes cardPop {
      0% {
        transform: scale(0.92);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.02);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .patient-number.new-number {
      animation: numberScale 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes numberScale {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      60% {
        transform: scale(1.08);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .sound-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      cursor: pointer;
      transition: opacity 0.5s ease;
    }

    .sound-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .sound-content {
      text-align: center;
      animation: breathe 2s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .sound-icon {
      font-size: 8rem;
      margin-bottom: 2rem;
      filter: drop-shadow(0 0 30px rgba(59, 130, 246, 0.5));
    }

    .sound-title {
      color: white;
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sound-text {
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.5rem;
      font-weight: 400;
    }

    video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 1200px) {
      .patient-number {
        font-size: 12rem;
      }
      
      .patient-card {
        padding: 4rem 7rem;
      }
    }
  </style>
</head>

<body>

<div class="sound-overlay" id="soundOverlay">
  <div class="sound-content">
    <div class="sound-icon">🔊</div>
    <div class="sound-title">CLIQUEZ N'IMPORTE OÙ</div>
    <div class="sound-text">Pour activer le son et la voix</div>
  </div>
</div>

<header>
  <div class="header-content">
    <div class="logo">
      <div class="logo-icon">🏥</div>
      <div class="logo-text">Cabinet Médical</div>
    </div>
    <div class="datetime" id="clock"></div>
  </div>
</header>

<div class="main-content">
  <div class="label">Patient appelé</div>
  
  <div class="patient-card" id="patientCard">
    <div class="patient-number" id="patientNumber">-</div>
  </div>

  <div class="message-badge">
    <div class="message-icon">✓</div>
    <span>Veuillez vous présenter</span>
  </div>
</div>

<div class="footer">
  <div class="footer-content">
    <div class="signature">Designed by NEXTGEN TECH</div>
    <div class="status-dot">
      <div class="dot"></div>
      Système actif
    </div>
  </div>
</div>

<!-- Audio dynamique pour la voix -->
<video id="voicePlayer" preload="auto" playsinline></video>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCYkKPiypMYMNuTHZ1itXPGSpRwGql92ZA",
  authDomain: "medecinetienne-a92d1.firebaseapp.com",
  projectId: "medecinetienne-a92d1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ref = doc(db, "tickets", "etat");

let lastCalled = null;
let soundEnabled = false;
const overlay = document.getElementById("soundOverlay");
const voicePlayer = document.getElementById("voicePlayer");

// Activation
function enableSound() {
  if (soundEnabled) return;
  soundEnabled = true;
  overlay.classList.add("hidden");
}

overlay.addEventListener('click', enableSound);
overlay.addEventListener('touchstart', enableSound);
overlay.addEventListener('keydown', enableSound);
document.addEventListener('click', enableSound, { once: true });

// Fonction pour jouer la voix
function playVoice(numero) {
  const audioURL = `https://chicanos-tech.github.io/MedecinEtienne/sons/patient_${numero}.mp3`;
  
  voicePlayer.src = audioURL;
  voicePlayer.volume = 0.8;
  voicePlayer.play().catch(e => {
    console.log("Erreur lecture audio:", e);
  });
}

// Écoute Firebase
onSnapshot(ref, (snap) => {
  if (!snap.exists()) return;
  
  const data = snap.data();
  const currentPatient = data.en_cours || data.appele || 0;
  
  const numberEl = document.getElementById("patientNumber");
  numberEl.innerText = currentPatient === 0 ? "-" : currentPatient;

  if (currentPatient !== lastCalled && currentPatient !== 0 && soundEnabled) {
    lastCalled = currentPatient;

    // Animations
    const card = document.getElementById("patientCard");
    card.classList.remove("new-patient");
    void card.offsetWidth;
    card.classList.add("new-patient");

    numberEl.classList.remove("new-number");
    void numberEl.offsetWidth;
    numberEl.classList.add("new-number");

    // JOUER LA VOIX PRÉ-ENREGISTRÉE
    playVoice(currentPatient);
  }
});

// Horloge
function updateClock() {
  const now = new Date();
  const options = { 
    weekday: 'long', 
    day: 'numeric', 
    month: 'long',
    year: 'numeric'
  };
  const date = now.toLocaleDateString("fr-FR", options);
  const time = now.toLocaleTimeString("fr-FR", { 
    hour: '2-digit', 
    minute: '2-digit',
    second: '2-digit'
  });
  document.getElementById("clock").innerText = `${date} • ${time}`;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
