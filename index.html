<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salle d'attente</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8f9fa;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background: white;
      padding: 2rem 3rem;
      text-align: center;
      border-bottom: 3px solid #0066cc;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
    }

    .header-icon {
      color: #0066cc;
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .datetime {
      margin-top: 0.8rem;
      font-size: 1.2rem;
      color: #6c757d;
      font-weight: 300;
    }

    /* Contenu principal */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4rem;
      background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
    }

    .label {
      font-size: 2.2rem;
      font-weight: 300;
      color: #495057;
      margin-bottom: 2.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Carte numéro patient */
    .patient-card {
      background: white;
      border-radius: 30px;
      padding: 5rem 9rem;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.1),
        0 0 0 1px rgba(0, 102, 204, 0.1);
      position: relative;
      overflow: hidden;
      animation: cardEntrance 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 2px solid #e9ecef;
    }

    /* Barre accent bleue */
    .patient-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #0066cc 0%, #0099ff 100%);
    }

    @keyframes cardEntrance {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .patient-number {
      font-size: 14rem;
      font-weight: 700;
      color: #0066cc;
      line-height: 1;
      position: relative;
      animation: numberPulse 2s ease-in-out infinite;
    }

    @keyframes numberPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.03);
        opacity: 0.9;
      }
    }

    .message {
      margin-top: 3rem;
      padding: 1.8rem 4rem;
      background: #0066cc;
      color: white;
      font-size: 2.3rem;
      font-weight: 500;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 102, 204, 0.25);
      animation: messageGlow 2s ease-in-out infinite;
    }

    @keyframes messageGlow {
      0%, 100% {
        box-shadow: 0 10px 30px rgba(0, 102, 204, 0.25);
      }
      50% {
        box-shadow: 0 10px 40px rgba(0, 102, 204, 0.4);
      }
    }

    /* Icône */
    .check-icon {
      display: inline-block;
      width: 2.5rem;
      height: 2.5rem;
      background: white;
      color: #0066cc;
      border-radius: 50%;
      text-align: center;
      line-height: 2.5rem;
      margin-right: 1rem;
      font-weight: 700;
      font-size: 1.8rem;
    }

    /* Footer signature */
    .signature {
      position: fixed;
      bottom: 1.5rem;
      right: 2rem;
      font-size: 0.85rem;
      color: #adb5bd;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* Animation nouveau patient */
    .patient-card.new-patient {
      animation: newPatientAlert 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes newPatientAlert {
      0% {
        transform: scale(0.9);
        opacity: 0;
        box-shadow: 0 0 0 0 rgba(0, 102, 204, 0.4);
      }
      50% {
        box-shadow: 0 0 0 20px rgba(0, 102, 204, 0);
      }
      100% {
        transform: scale(1);
        opacity: 1;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      }
    }

    /* Indicateur médical (optionnel) */
    .medical-cross {
      position: fixed;
      top: 50%;
      left: 5%;
      transform: translateY(-50%);
      font-size: 8rem;
      color: rgba(0, 102, 204, 0.05);
      z-index: 0;
    }

    .medical-cross-right {
      position: fixed;
      top: 50%;
      right: 5%;
      transform: translateY(-50%);
      font-size: 8rem;
      color: rgba(0, 102, 204, 0.05);
      z-index: 0;
    }
  </style>
</head>

<body>

<!-- Croix médicales décoratives -->
<div class="medical-cross">✚</div>
<div class="medical-cross-right">✚</div>

<header>
  <div class="header-icon">🏥</div>
  <h1>Salle d'attente</h1>
  <div class="datetime" id="clock"></div>
</header>

<div class="main-content">
  <div class="label">Patient appelé</div>
  
  <div class="patient-card" id="patientCard">
    <div class="patient-number" id="patientNumber">-</div>
  </div>

  <div class="message">
    <span class="check-icon">✓</span>
    Veuillez vous présenter
  </div>
</div>

<div class="signature">
  Solution designed by NEXTGEN TECH
</div>

<!-- Son -->
<audio id="beep">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCYkKPiypMYMNuTHZ1itXPGSpRwGql92ZA",
  authDomain: "medecinetienne-a92d1.firebaseapp.com",
  projectId: "medecinetienne-a92d1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ref = doc(db, "tickets", "etat");

let lastCalled = null;

// Écoute des changements
onSnapshot(ref, (snap) => {
  if (!snap.exists()) return;
  
  const data = snap.data();
  const currentPatient = data.en_cours || data.appele || 0;
  
  document.getElementById("patientNumber").innerText = currentPatient === 0 ? "-" : currentPatient;

  // Animation + son + voix quand nouveau patient
  if (currentPatient !== lastCalled && currentPatient !== 0) {
    lastCalled = currentPatient;

    // Animation de la carte
    const card = document.getElementById("patientCard");
    card.classList.remove("new-patient");
    void card.offsetWidth; // Force reflow
    card.classList.add("new-patient");

    // Son
    document.getElementById("beep").play();

    // Voix
    const msg = new SpeechSynthesisUtterance(
      `Patient numéro ${currentPatient}, veuillez vous présenter`
    );
    msg.lang = "fr-FR";
    msg.rate = 0.9;
    msg.pitch = 1;
    window.speechSynthesis.speak(msg);
  }
});

// Horloge
function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerText =
    now.toLocaleDateString("fr-FR", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }) +
    " • " +
    now.toLocaleTimeString("fr-FR");
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
